[project]
name = "crosswalk-traffic-analysis"
version = "0.1.0"
description = "Count vehicles and pedestrians at a crosswalk from fixed-camera video"
authors = [
    { name = "Noah Spitzer-Williams" }
]
requires-python = ">=3.12"
dependencies = [
    "coremltools>=9.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "supervision>=0.30,<0.31",
    "ultralytics>=8.4.177",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The replay tests (tests/test_replay.py) run real video through detection, so they're slow and
# need clips that only exist locally. Run them with: PYTHONPATH=. uv run pytest -m replay
markers = ["replay: replays a saved crossing's video through detection, tracking and judging"]
addopts = "-m 'not replay'"
