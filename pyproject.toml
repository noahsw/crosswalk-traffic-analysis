[project]
name = "crosswalk-traffic-analysis"
version = "0.1.0"
description = "Count vehicles and pedestrians at a crosswalk from fixed-camera video"
authors = [
    { name = "Noah Spitzer-Williams" }
]
requires-python = ">=3.12"
dependencies = [
    "coremltools>=9.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "supervision>=0.30,<0.31",
    "ultralytics>=8.4.177",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
